<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5f8">
<title>Track Manuals Atlas</title>
<link rel="stylesheet" href="./ui/themes.css">
<script src="./ui/theme.js"></script>
<style>
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--font);height:100vh;height:100dvh;overflow:hidden}
  button,input{font:inherit;color:inherit}
  canvas#g{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas#g.drag{cursor:grabbing}
  .corner{position:fixed;top:10px;z-index:5;display:flex;gap:6px;align-items:center}
  .corner.l{left:12px}.corner.r{right:12px}
  .title{font-weight:650;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 12px;box-shadow:var(--shadow)}
  .iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;cursor:pointer;min-height:34px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);display:inline-block;font-size:.9rem}
  .iconbtn:hover,.iconbtn:focus-visible{background:var(--surface2)}
  .legend{position:fixed;left:12px;top:54px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.78rem;color:var(--muted);box-shadow:var(--shadow);max-width:46vw}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 8px;vertical-align:baseline}.legend i:first-child{margin-left:0}
  /* node card */
  #card{position:fixed;right:12px;top:56px;width:min(360px,92vw);max-height:calc(100dvh - 190px);overflow:auto;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px}
  #card[hidden]{display:none}
  #card h2{font-size:1rem;margin:0 22px 4px 0}#card .sub{color:var(--muted);font-size:.82rem;margin-bottom:6px}
  #card .txt{white-space:pre-wrap;font-size:.9rem;max-height:30vh;overflow:auto;background:var(--surface2);border-radius:8px;padding:8px}
  #card .x{position:absolute;right:8px;top:6px;border:0;background:none;cursor:pointer;font-size:1.1rem}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  /* chat dock, bottom centre */
  #dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,94vw);z-index:7;display:flex;flex-direction:column;gap:8px}
  #ans{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;max-height:42vh;overflow:auto;position:relative}
  #ans[hidden]{display:none}
  #ans .x{position:absolute;right:8px;top:4px;border:0;background:none;cursor:pointer;font-size:1.1rem}
  #ans .lead{font-weight:600;margin-bottom:4px}#ans ul{margin:4px 0 6px;padding-left:18px}
  #ans .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
  #ans table{border-collapse:collapse;font-size:.82rem;display:block;overflow-x:auto}#ans td,#ans th{border:1px solid var(--line);padding:3px 6px;text-align:left}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.82rem;margin:2px 4px 2px 0}
  .chip:hover,.chip:focus-visible{outline:2px solid var(--accent)}
  mark{background:var(--mark);color:inherit;border-radius:3px}
  form#f{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:6px 6px 6px 16px;align-items:center}
  form#f:focus-within{outline:2px solid var(--accent)}
  #q{flex:1;border:0;background:none;outline:0;min-width:0}
  #go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 18px;cursor:pointer;font-weight:600}
  #go:disabled{opacity:.5}
  .hint{text-align:center;color:var(--muted);font-size:.78rem;margin-top:-2px}
  #tip{position:fixed;z-index:8;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.8rem;box-shadow:var(--shadow);display:none;max-width:280px}
  @media (max-width:640px){.legend{display:none}#refsBox{display:none}#card{top:50px}}
</style>
</head>
<body>
<canvas id="g" aria-label="Knowledge graph of the six railway manuals: manuals, chapters and paragraphs" role="img"></canvas>
<div class="corner l"><span class="title">Track Manuals Atlas</span></div>
<div class="corner r"><button class="iconbtn" id="fit" title="Show the whole graph">Reset view</button><span id="hostSettings"></span><a class="iconbtn" href="learn.html" title="Practice cards from the manuals">Learn</a><a class="iconbtn" href="expert.html" title="The full expert workbench (drawings, revisions, 3D)">Expert view</a></div>
<div class="legend" id="legend"></div>
<label class="legend" id="refsBox" style="top:92px;cursor:pointer"><input type="checkbox" id="refs"> Show all cross-references between paragraphs</label>
<aside id="card" hidden aria-live="polite"></aside>
<div id="tip"></div>
<div id="dock">
  <div id="ans" hidden aria-live="polite"></div>
  <form id="f" autocomplete="off"><input id="q" type="text" placeholder="Ask a question about the manuals…" aria-label="Your question" disabled><button id="go" disabled>Ask</button></form>
  <div class="hint" id="status">Loading…</div>
</div>
<script src="./lib/rdso_search.js"></script>
<script src="./data/search/search_index.js"></script>
<script src="./data/search/clause_extras.js"></script>
<script src="./data/search/crossrefs.js"></script>
<script src="./data/search/tables.js"></script>
<script src="./data/search/editions.js"></script>
<script src="./data/search/drawing_cites.js"></script>
<script src="./lib/rdso_graphq.js"></script>
<script src="./lib/rdso_chat.js"></script>
<script src="./lib/rdso_browse.js"></script>
<script src="./ui/settings.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  window.RDSOSettings.mount($('hostSettings'));
  if (!window.RDSOSearch || !window.RDSO_SEARCH_INDEX || !window.RDSOChat || !window.RDSOBrowse) { $('status').textContent = 'The search index did not load.'; return; }
  var PDF = { IRPWM: 'manuals/IRPWM 2024 Corrected Up To ACS - 14 (29-07-2026)-1.pdf', TMM: 'manuals/INDIAN RAILWAYS TRACK MACHINE MANUAL (INCORPORATED UPTO ACS 10)_FINAL.pdf',
              STMM: 'manuals/STMM-date  27.05.24.pdf', USFD: 'manuals/usfd_new 24-2-26.pdf', AT_WELD: 'manuals/ATWeld_Manual-2022.pdf',
              FBW: 'manuals/FBW Manual-Reprint 2022- Incorporated up to CS5.pdf' };
  var model = RDSOBrowse.build(RDSO_SEARCH_INDEX), xr = window.RDSO_CROSSREFS || { out: {}, in: {} };
  var eng = RDSOSearch.create(RDSO_SEARCH_INDEX);
  var chat = RDSOChat.create(eng, { extras: window.RDSO_CLAUSE_EXTRAS, xrefs: xr, tables: window.RDSO_TABLES, editions: window.RDSO_EDITIONS, graph: window.RDSOGraphQ.create({ xrefs: window.RDSO_CROSSREFS, clauseText: function (id) { return eng.clauseText(id); }, drawingCites: window.RDSO_DRAWING_CITES }) });

  /* ---- graph: manual -> chapter -> paragraph, laid out radially (deterministic, no simulation) ---- */
  var COLORS = ['#e0592a', '#2a8fe0', '#2aa876', '#a64fd1', '#d19a1f', '#d1446f'];
  var nodes = [], byId = {}, edges = [];
  function add(n) { nodes.push(n); byId[n.id] = n; return n; }
  var M = model.manuals.length;
  function fib(i, n) { var y = n > 1 ? 1 - 2 * i / (n - 1) : 0, r = Math.sqrt(Math.max(0, 1 - y * y)), t = i * 2.39996323; return [Math.cos(t) * r, y, Math.sin(t) * r]; }   // point on a unit sphere
  model.manuals.forEach(function (m, mi) {
    var a = mi / M * Math.PI * 2 - Math.PI / 2, R = 1000, my = (mi % 2 ? 1 : -1) * 170;
    var mn = add({ id: 'M:' + m.alias, kind: 'manual', label: m.alias.replace('_', ' '), sub: m.name, x: Math.cos(a) * R, y: my, z: Math.sin(a) * R, r: 15, color: COLORS[mi], alias: m.alias });
    var nc = m.chapters.length;
    m.chapters.forEach(function (ch, ci) {
      var d = fib(ci, nc), CR = 300 + 90 * Math.sqrt(nc / 15);
      var cn = add({ id: 'H:' + m.alias + ':' + ch.num, kind: 'chapter', label: 'Ch. ' + ch.num, sub: ch.title, x: mn.x + d[0] * CR, y: mn.y + d[1] * CR, z: mn.z + d[2] * CR, r: 7.5, color: COLORS[mi], alias: m.alias });
      edges.push([mn.id, cn.id, 0]);
      var n = ch.clauses.length, rr = 18 + 9 * Math.cbrt(n);
      ch.clauses.forEach(function (c, k) {
        var e = fib(k, n);
        var pn = add({ id: c.id, kind: 'clause', label: c.alias.replace('_', ' ') + ' ' + c.para, sub: c.title, x: cn.x + e[0] * rr, y: cn.y + e[1] * rr, z: cn.z + e[2] * rr, r: 2.6, color: COLORS[mi], alias: m.alias });
        edges.push([cn.id, pn.id, 0]);
      });
    });
  });
  var links = [];     // resolved paragraph-to-paragraph references
  Object.keys(xr.out).forEach(function (src) { var seen = {}; xr.out[src].forEach(function (e) { if (e[2] === 'RESOLVED') e[3].forEach(function (t) { if (byId[src] && byId[t] && t !== src && !seen[t]) { seen[t] = 1; links.push([src, t]); } }); }); });
  $('legend').innerHTML = model.manuals.map(function (m, i) { return '<i style="background:' + COLORS[i] + '"></i>' + esc(m.alias.replace('_', ' ')); }).join('') + ' · big dot = manual, medium = chapter, small = paragraph';

  /* ---- 3D camera on a 2D canvas: yaw/pitch rotation, perspective, depth ordering, smooth moves ---- */
  var cv = $('g'), ctx = cv.getContext('2d'), W = 0, H = 0, dpr = 1, sel = null, hot = {}, dirty = true;
  var showRefs = false, cam = { yaw: 0.6, pitch: 0.38, zoom: 0.45, tx: 0, ty: 0, tz: 0 }, goal = null, spin = true, lastTouch = 0, P = {}, order = [];
  var DIST = 2600, TAU = 6.2832;
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function resize() { dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; dirty = true; }
  function bounds(list) {
    var c = [0, 0, 0], r = 0; list.forEach(function (n) { c[0] += n.x; c[1] += n.y; c[2] += n.z; }); c = c.map(function (v) { return v / list.length; });
    list.forEach(function (n) { r = Math.max(r, Math.hypot(n.x - c[0], n.y - c[1], n.z - c[2])); }); return { c: c, r: r };
  }
  function flyTo(list, keepAngles) {
    var b = bounds(list), extent = Math.max(90, b.r + 70), avail = Math.min(W * 0.7, H - 400) / 2;
    goal = { tx: b.c[0], ty: b.c[1], tz: b.c[2], zoom: Math.max(0.12, Math.min(8, avail / extent)) };
    if (!keepAngles) { goal.yaw = cam.yaw; goal.pitch = cam.pitch; }
    dirty = true;
  }
  function fit() { spin = true; flyTo(nodes, true); goal.zoom = Math.min(W * 0.46, H * 0.4) / 1500 * 1.0; }
  function project() {
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    order.length = 0;
    nodes.forEach(function (n) {
      var x = n.x - cam.tx, y = n.y - cam.ty, z = n.z - cam.tz;
      var x1 = x * cy - z * sy, z1 = x * sy + z * cy, y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
      var f = DIST / (DIST + z2), k = cam.zoom * f, q = P[n.id] || (P[n.id] = {});
      q.x = W / 2 + x1 * k; q.y = (H - 130) / 2 + 40 + y1 * k; q.f = f; q.z = z2; q.k = k; order.push(n);
    });
    order.sort(function (a, b) { return P[b.id].z - P[a.id].z; });
  }
  function depthA(q) { return Math.max(0.22, Math.min(1, 1.12 - (q.z + 1500) / 3200)); }
  function draw() {
    dirty = false; project();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    var line = css('--line'), ink = css('--ink'), accent = css('--accent'), bg = css('--surface');
    // soft vignette so the cloud reads as a space rather than a flat plane
    var g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, Math.max(W, H) * 0.7); g.addColorStop(0, 'rgba(128,128,128,0)'); g.addColorStop(1, 'rgba(128,128,128,0.16)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.globalAlpha = 0.5; ctx.beginPath();
    edges.forEach(function (e) { var a = P[e[0]], b = P[e[1]]; ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); });
    ctx.stroke(); ctx.globalAlpha = 1;
    if (showRefs) {   // typed relationship filter: every resolved paragraph-to-paragraph reference, faint
      ctx.strokeStyle = accent; ctx.lineWidth = 0.7; ctx.globalAlpha = 0.22; ctx.beginPath();
      links.forEach(function (l) { var a = P[l[0]], b = P[l[1]]; ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo((a.x + b.x) / 2 + (b.y - a.y) * 0.14, (a.y + b.y) / 2 - (b.x - a.x) * 0.14, b.x, b.y); });
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    var focus = sel ? [sel.id] : Object.keys(hot);
    ctx.strokeStyle = accent; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.85; ctx.beginPath();
    links.forEach(function (l) { if (focus.indexOf(l[0]) >= 0 || focus.indexOf(l[1]) >= 0) { var a = P[l[0]], b = P[l[1]];
      ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo((a.x + b.x) / 2 + (b.y - a.y) * 0.14, (a.y + b.y) / 2 - (b.x - a.x) * 0.14, b.x, b.y); } });
    ctx.stroke(); ctx.globalAlpha = 1;
    var anyHot = Object.keys(hot).length > 0;
    order.forEach(function (n) {   // far to near
      var q = P[n.id]; if (q.x < -30 || q.y < -30 || q.x > W + 30 || q.y > H + 30) return;
      var isHot = hot[n.id] || (sel && sel.id === n.id), r = Math.max(n.kind === 'clause' ? 1.5 : 3, n.r * q.k * 1.15 * Math.pow(cam.zoom, -0.25));
      ctx.globalAlpha = (anyHot && !isHot && n.kind === 'clause' ? 0.2 : 1) * depthA(q);
      ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(q.x, q.y, isHot ? r + 3 : r, 0, TAU); ctx.fill();
      if (r > 3.2) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(q.x - r * 0.3, q.y - r * 0.33, r * 0.38, 0, TAU); ctx.fill(); }
      if (isHot) { ctx.lineWidth = 2.5; ctx.strokeStyle = ink; ctx.beginPath(); ctx.arc(q.x, q.y, r + 3, 0, TAU); ctx.stroke(); }
    });
    ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    order.forEach(function (n) {
      var q = P[n.id], zoomed = cam.zoom * q.f;
      var show = n.kind === 'manual' || (n.kind === 'chapter' && zoomed > 0.5) || (n.kind === 'clause' && (zoomed > 2.4 || hot[n.id] || (sel && sel.id === n.id)));
      if (!show || q.x < 0 || q.y < 0 || q.x > W || q.y > H) return;
      var fs = (n.kind === 'manual' ? 15 : 11) * Math.max(0.8, Math.min(1.25, q.f)); ctx.font = (n.kind === 'manual' ? '700 ' : '500 ') + fs.toFixed(1) + 'px system-ui,sans-serif';
      var dy = (n.kind === 'manual' ? n.r * q.k * 1.15 * Math.pow(cam.zoom, -0.25) + 12 : 14);
      ctx.globalAlpha = Math.max(0.5, depthA(q)); ctx.lineWidth = 3; ctx.strokeStyle = bg; ctx.strokeText(n.label, q.x, q.y + dy); ctx.fillStyle = ink; ctx.fillText(n.label, q.x, q.y + dy); ctx.globalAlpha = 1;
    });
  }
  function step() {
    if (goal) {   // ease the camera toward its goal
      var done = true;
      ['tx', 'ty', 'tz', 'zoom'].forEach(function (k) { var d = goal[k] - cam[k]; if (Math.abs(d) > (k === 'zoom' ? 0.002 : 0.6)) { cam[k] += d * 0.14; done = false; } else cam[k] = goal[k]; });
      if (done) goal = null; dirty = true;
    } else if (spin && !drag && !sel && !Object.keys(hot).length && !document.hidden) { cam.yaw += 0.0016; dirty = true; }
  }
  function loop() { step(); if (dirty) draw(); requestAnimationFrame(loop); }
  function pick(px, py) {
    var best = null, bz = 1e9;
    nodes.forEach(function (n) { var q = P[n.id]; if (!q) return; var dx = q.x - px, dy = q.y - py, rr = Math.max(6, n.r * q.k * 1.15 * Math.pow(cam.zoom, -0.25) + 3);
      if (dx * dx + dy * dy < rr * rr && q.z < bz && (n.kind !== 'clause' || cam.zoom * q.f > 0.3)) { bz = q.z; best = n; } });
    return best;
  }
  var drag = null, moved = 0;
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  cv.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, tx: cam.tx, ty: cam.ty, tz: cam.tz, pan: e.shiftKey || e.button === 2 }; moved = 0; goal = null; spin = false; cv.setPointerCapture(e.pointerId); cv.classList.add('drag'); });
  cv.addEventListener('pointermove', function (e) {
    if (drag) {
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
      if (drag.pan) {   // move the look-at point in the screen plane
        var k = 1 / cam.zoom, cy = Math.cos(drag.yaw), sy = Math.sin(drag.yaw), cp = Math.cos(drag.pitch), sp = Math.sin(drag.pitch);
        cam.tx = drag.tx - (dx * cy - dy * sp * sy) * k; cam.ty = drag.ty - dy * cp * k; cam.tz = drag.tz - (-dx * sy - dy * sp * cy) * k;
      } else { cam.yaw = drag.yaw + dx * 0.006; cam.pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + dy * 0.006)); }
      dirty = true; return;
    }
    var n = pick(e.clientX, e.clientY), tip = $('tip');
    if (n) { tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, W - 290) + 'px'; tip.style.top = e.clientY + 14 + 'px'; tip.innerHTML = '<b>' + esc(n.label) + '</b>' + (n.sub ? '<br>' + esc(String(n.sub).slice(0, 90)) : ''); } else tip.style.display = 'none';
  });
  cv.addEventListener('pointerup', function (e) { cv.classList.remove('drag'); if (drag && moved < 5) { project(); var n = pick(e.clientX, e.clientY); if (n) select(n, true); else { sel = null; $('card').hidden = true; dirty = true; } } drag = null; });
  cv.addEventListener('pointerleave', function () { $('tip').style.display = 'none'; });
  cv.addEventListener('wheel', function (e) { e.preventDefault(); goal = null; cam.zoom = Math.max(0.1, Math.min(14, cam.zoom * Math.exp(-e.deltaY * 0.0015))); dirty = true; }, { passive: false });
  function focusOn(ids) { var ns = ids.map(function (i) { return byId[i]; }).filter(Boolean); if (ns.length) { spin = false; flyTo(ns, false); } }

  /* ---- node card ---- */
  function select(n, zoom) {
    sel = n; hot = {}; dirty = true;
    var c = model.byId[n.id], card = $('card'), h = '<button class="x" aria-label="Close" id="cardX">✕</button>';
    if (n.kind === 'clause' && c) {
      var out = (xr.out[n.id] || []).reduce(function (a, e) { return a + (e[2] === 'RESOLVED' ? e[3].filter(function (t) { return byId[t]; }).length : 0); }, 0), inn = (xr.in[n.id] || []).filter(function (t) { return byId[t]; }).length;
      h += '<h2>' + esc(n.label) + '</h2><div class="sub">' + esc(n.sub) + ' · page ' + esc(c.page) + ' · refers to ' + out + ', referred to by ' + inn + ' (drawn in blue)</div><div class="txt">' + esc(c.text.slice(0, 1500)) + (c.text.length > 1500 ? '\n…' : '') + '</div>' +
        '<div class="acts"><button class="iconbtn" data-ask="' + esc('Explain ' + n.label) + '">Ask about this</button><a class="iconbtn" href="browse.html#' + encodeURIComponent(n.id) + '">Read in context</a><a class="iconbtn" target="_blank" rel="noopener" href="' + esc(encodeURI(PDF[c.alias] || '') + '#page=' + (c.page || 1)) + '">Open page ↗</a></div>';
      if (zoom) focusOn([n.id].concat((xr.out[n.id] || []).reduce(function (a, e) { return e[2] === 'RESOLVED' ? a.concat(e[3]) : a; }, [])).concat(xr.in[n.id] || []).filter(function (i) { return byId[i]; }).slice(0, 12));
    } else if (n.kind === 'chapter') {
      var m = model.manuals.filter(function (x) { return x.alias === n.alias; })[0], ch = m.chapters.filter(function (x) { return 'H:' + n.alias + ':' + x.num === n.id; })[0];
      h += '<h2>' + esc(n.alias.replace('_', ' ')) + ' · ' + esc(n.label) + '</h2><div class="sub">' + esc(n.sub) + ' · ' + ch.clauses.length + ' paragraphs</div><div class="acts"><button class="iconbtn" data-scope="' + n.alias + '" data-chapter="' + parseInt(n.id.split(':')[2], 10) + '">Ask only this chapter</button><button class="iconbtn" data-ask="' + esc('What does ' + n.alias.replace('_', ' ') + ' ' + n.label + ' cover?') + '">Ask about this chapter</button><a class="iconbtn" href="browse.html#' + encodeURIComponent(ch.clauses[0].id) + '">Read</a></div>';
      if (zoom) focusOn(['H:' + n.alias + ':' + ch.num].concat(ch.clauses.map(function (c) { return c.id; })));
    } else {
      var mm = model.manuals.filter(function (x) { return x.alias === n.alias; })[0];
      h += '<h2>' + esc(mm.name) + '</h2><div class="sub">' + mm.chapters.length + ' chapters · ' + mm.count + ' paragraphs</div><div class="acts"><button class="iconbtn" data-scope="' + n.alias + '">Ask only this manual</button><a class="iconbtn" href="browse.html#' + encodeURIComponent(mm.chapters[0].clauses[0].id) + '">Read</a></div>';
      if (zoom) focusOn(nodes.filter(function (x) { return x.alias === n.alias; }).map(function (x) { return x.id; }));
    }
    card.innerHTML = h; card.hidden = false;
  }

  /* ---- chat ---- */
  var lastQ = '', scope = '';
  function hl(text, q) {
    var words = (String(q).toLowerCase().match(/[a-z0-9]{4,}/g) || []).filter(function (w, i, a) { return a.indexOf(w) === i; }), out = esc(text);
    return words.length ? out.replace(new RegExp('\\b((?:' + words.join('|') + ')(?:s|es|ed|ing|ly)?)\\b', 'gi'), '<mark>$1</mark>') : out;
  }
  function chip(t, a) { return '<button type="button" class="chip" data-ask="' + esc(a || t) + '">' + esc(t) + '</button>'; }
  function cite(c) { return '<a class="chip" href="browse.html#' + encodeURIComponent(c.clause) + '" data-focus="' + esc(c.clause) + '">📄 ' + esc(c.label + ' · p.' + c.page) + '</a>'; }
  function answerHtml(r, q) {
    var h = '<button class="x" aria-label="Close answer" id="ansX">✕</button>';
    if (r.kind === 'answer') {
      if (r.lead) h += '<div class="lead">' + esc(r.lead) + '</div>';
      if (r.table) h += '<table><thead><tr>' + r.table.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + r.table.rows.map(function (w) { return '<tr>' + w.cells.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      else h += '<ul>' + r.points.map(function (p) { return '<li>' + hl(p.text, q) + '</li>'; }).join('') + '</ul>';
      (r.ownedTables || []).forEach(function (O) { h += '<div class="meta" style="margin-top:4px">Table in this paragraph (page ' + esc(O.page) + ')</div><table><thead><tr>' + O.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + O.rows.map(function (w) { return '<tr>' + w.cells.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>'; });
      if (r.edition) h += '<div class="meta" id="edition">From: ' + esc(r.edition) + (r.amendments && r.amendments.length ? ' · correction-slip marks ' + esc(r.amendments.join(', ')) : '') + '</div>';
      h += '<div class="meta">' + cite(r.primary) + '<span>' + ({ high: 'Strong match', medium: 'Likely match', low: 'Not sure' }[r.confidence] || '') + '</span>' + (r.caveat ? '<span>' + esc(r.caveat) + '</span>' : '') + '</div>';
      if (r.followups && r.followups.length) h += '<div style="margin-top:6px">' + r.followups.slice(0, 3).map(function (f) { return chip(f); }).join('') + '</div>';
    } else if (r.kind === 'relation') {
      h += '<div class="lead">' + esc(r.text) + '</div>';
      if (r.rows && r.rows.length) h += '<ol style="margin:4px 0;padding-left:20px">' + r.rows.slice(0, 8).map(function (x) {
        var c = x.cite || x.to, from = r.mode === 'path' ? esc(x.from.label) + ' → ' : (x.depth > 1 ? 'via ' + esc(x.via.label) + ' → ' : '');
        return '<li>' + from + '<a class="chip" href="browse.html#' + encodeURIComponent(c.clause) + '" data-focus="' + esc(c.clause) + '">📄 ' + esc(c.label) + '</a><div class="meta">' + (x.back ? 'Back-to note in ' : 'In ') + esc((x.at || c).label) + ': “' + esc(x.quote) + '”</div></li>'; }).join('') + '</ol>' + (r.rows.length > 8 ? '<div class="meta">…and ' + (r.rows.length - 8) + ' more (ask in the chat page for the full list).</div>' : '');
    } else if (r.kind === 'clarify') h += esc(r.text) + '<div>' + r.options.map(function (o) { return chip(o.name + ' — ' + o.label + ': ' + o.title.slice(0, 50), o.ask); }).join('') + '</div>';
    else if (r.kind === 'no_evidence') h += esc(r.text) + ((r.nearest || []).length ? '<div class="meta" style="margin-top:4px">Closest topics</div><div>' + r.nearest.map(function (n) { return chip(n.label + ' — ' + n.title.slice(0, 50), 'What does ' + n.alias + ' Para ' + n.para + ' say?'); }).join('') + '</div>' : '');
    else { h += esc(r.text || ''); if (r.primary) h += '<div class="meta">' + cite(r.primary) + '</div>'; if (r.related) h += '<div>' + r.related.map(function (n) { return chip(n.label + ' — ' + n.title.slice(0, 50), 'What does ' + n.alias + ' Para ' + n.para + ' say?'); }).join('') + '</div>'; }
    return h;
  }
  function ask(text) {
    text = String(text || '').trim(); if (!text) return;
    var r = chat.ask(text); lastQ = text; $('q').value = '';
    $('ans').innerHTML = answerHtml(r, text); $('ans').hidden = false; $('ans').scrollTop = 0;
    var ids = [];
    if (r.primary) ids.push(r.primary.clause);
    (r.related || []).forEach(function (x) { if (x.clause) ids.push(x.clause); });
    (r.alsoSee || []).forEach(function (x) { if (x.cite) ids.push(x.cite.clause); });
    if (r.kind === 'relation') (r.nodes || []).forEach(function (i) { ids.push(i); });
    hot = {}; ids.forEach(function (i) { if (byId[i]) hot[i] = 1; });
    sel = null; $('card').hidden = true;
    if (ids.length) focusOn(ids.filter(function (i) { return byId[i]; })); dirty = true;
  }
  function setScope(a, chapter) { scope = a || ''; chat.setScope(scope, chapter); var where = scope.replace('_', ' ') + (chapter ? ', chapter ' + chapter : ''); $('q').placeholder = scope ? 'Ask a question about ' + where + ' only…' : 'Ask a question about the manuals…'; $('status').textContent = scope ? 'Searching only in ' + where + ' (Reset view clears this)' : 'Nothing leaves this computer. Click a dot to read it; drag to rotate, scroll to zoom, Shift+drag to move.'; }
  $('f').addEventListener('submit', function (e) { e.preventDefault(); ask($('q').value); });
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-ask]'); if (a) { ask(a.dataset.ask); return; }
    var s = e.target.closest('[data-scope]'); if (s) { setScope(s.dataset.scope, s.dataset.chapter); $('q').focus(); return; }
    var f = e.target.closest('[data-focus]'); if (f && !(e.ctrlKey || e.metaKey)) { e.preventDefault(); var n = byId[f.dataset.focus]; if (n) select(n, true); return; }
    if (e.target.id === 'ansX') { $('ans').hidden = true; hot = {}; dirty = true; }
    if (e.target.id === 'cardX') { $('card').hidden = true; sel = null; dirty = true; }
  });
  $('refs').addEventListener('change', function () { showRefs = this.checked; dirty = true; });
  $('fit').addEventListener('click', function () { sel = null; hot = {}; $('card').hidden = true; $('ans').hidden = true; setScope(''); cam.yaw = 0.6; cam.pitch = 0.38; fit(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    else if (e.key === 'Escape') { $('card').hidden = true; $('ans').hidden = true; sel = null; hot = {}; dirty = true; }
  });
  new MutationObserver(function () { dirty = true; }).observe(document.documentElement, { attributes: true });
  window.addEventListener('resize', function () { resize(); });
  resize(); fit(); cam.zoom = goal.zoom; cam.tx = goal.tx; cam.ty = goal.ty; cam.tz = goal.tz; goal = null; loop();
  setScope(''); $('q').disabled = $('go').disabled = false;
  var qs = new URLSearchParams(location.search); if (qs.get('manual') && RDSOChat.MANUALS[qs.get('manual')]) setScope(qs.get('manual'));
  if (qs.get('q')) ask(qs.get('q'));
  window.__graphReady = true; window.rdsoGraph = { nodes: nodes, links: links, edges: edges, ask: ask, select: function (id) { select(byId[id], true); }, state: function () { return { refs: showRefs, zoom: cam.zoom, yaw: cam.yaw, pitch: cam.pitch, sel: sel && sel.id, hot: Object.keys(hot) }; } };
})();
</script>
</body>
</html>
