name: Manuals KG Continuous Improvement Loop

on:
  push:
    branches: [ main, feat/manual-kg-separation-v2 ]
    paths:
      - "scripts/**"
      - "data/knowledge-graph/**"
      - "data/rdso_manuals_knowledge.json"
      - "data/rdso_extracted_knowledge.json"
      - "tests/**"
      - ".github/workflows/manual-kg-continuous.yml"
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  manuals-kg-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rebuild authoritative manual structure
        run: python scripts/ingest_all_manual_chapters.py

      - name: Rebuild canonical knowledge graph
        run: python scripts/generate_canonical_kg.py

      - name: Validate manuals structure and isolation
        run: python scripts/validate_manual_knowledge_graph.py

      - name: Run full validation suite
        run: python scripts/validate_all.py

      - name: Check for generated drift
        id: drift
        shell: bash
        run: |
          if ! git diff --quiet -- data/knowledge-graph/intermediate/all_chapters_extracted.json data/rdso_canonical_kg.json; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Generated KG artifacts changed during the loop."
            git diff --stat -- data/knowledge-graph/intermediate/all_chapters_extracted.json data/rdso_canonical_kg.json
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish deterministic generated artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.drift.outputs.drift == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/knowledge-graph/intermediate/all_chapters_extracted.json data/rdso_canonical_kg.json
          git commit -m "chore: refresh manuals knowledge graph artifacts"
          git push

      - name: Open failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Manual KG continuous loop failed";
            const body = [
              "The scheduled Manuals Knowledge Graph validation loop failed.",
              "",
              "Review the failed workflow run and fix the first failing gate.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "manual-kg"
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["manual-kg"]
              });
            }
