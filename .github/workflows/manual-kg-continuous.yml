name: Manuals KG Continuous Improvement Loop

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/**"
      - "data/knowledge-graph/**"
      - "data/rdso_extracted_knowledge.json"
      - "tests/**"
      - ".github/workflows/manual-kg-continuous.yml"
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  manuals-kg-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rebuild generated artifacts from source manuals
        run: python scripts/rebuild_all.py

      - name: Reproducibility check (no automatic commits to main)
        run: git diff --exit-code -- data/

      - name: Run full validation suite
        run: python scripts/validate_all.py

      - name: Open failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Manual KG continuous loop failed";
            const body = [
              "The scheduled Manuals Knowledge Graph validation loop failed.",
              "",
              "Review the failed workflow run and fix the first failing gate.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "manual-kg"
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["manual-kg"]
              });
            }
