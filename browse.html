<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5f8">
<title>Browse the manuals</title>
<link rel="stylesheet" href="./ui/themes.css">
<link rel="stylesheet" href="./ui/shell.css">
<script src="./ui/theme.js"></script>
<style>
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--font);height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  button,select,input{font:inherit;color:inherit}
  a{color:var(--accent)}
  .iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;cursor:pointer;min-height:34px;text-decoration:none;color:var(--ink);display:inline-block}
  .iconbtn:hover,.iconbtn:focus-visible{background:var(--surface2)}
  .top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .top h1{margin:0;font-size:1.05rem;font-weight:650;flex:1;white-space:nowrap}
  .wrap{flex:1;display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);min-height:0}
  nav.tree{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px}
  nav.tree select,nav.tree input{width:100%;margin-bottom:8px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
  details{margin:2px 0}
  summary{cursor:pointer;padding:5px 6px;border-radius:8px;font-weight:600;font-size:.92rem}
  summary:hover{background:var(--surface2)}
  .plist{margin:0;padding:0 0 4px 8px;list-style:none}
  .plist button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:.88rem;color:var(--ink)}
  .plist button:hover,.plist button:focus-visible{background:var(--surface2)}
  .plist button[aria-current="true"]{background:var(--chip);color:var(--chip-ink);font-weight:600}
  .plist .t{color:var(--muted)}
  main{overflow-y:auto;padding:18px 22px}
  .read{max-width:780px;margin:0 auto}
  .crumb{color:var(--muted);font-size:.85rem;margin-bottom:6px}
  .read h2{margin:0 0 10px;font-size:1.25rem}
  .text{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .box{margin:14px 0}.box h3{margin:0 0 6px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .box ul{margin:0;padding-left:18px}
  .box button.lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-align:left;text-decoration:underline}
  table.tb{border-collapse:collapse;font-size:.85rem;width:100%;display:block;overflow-x:auto}
  table.tb th,table.tb td{border:1px solid var(--line);padding:4px 7px;vertical-align:top;white-space:pre-line}
  table.tb th{background:var(--surface2)}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  .pn{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
  .viewer{width:0;overflow:hidden;background:var(--surface);border-left:1px solid var(--line)}
  @media (max-width:760px){.wrap{grid-template-columns:1fr}nav.tree{max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:12px}}
</style>
</head>
<body>
<header class="top">
  <h1>RDSO Manuals</h1>
  <nav class="tabs" aria-label="Pages"><a href="chat.html">Ask</a><a href="browse.html" aria-current="page">Browse manuals</a><a href="index.html">Explore graph</a></nav>
  <span id="hostSettings"></span>
</header>
<div class="wrap">
  <nav class="tree" aria-label="Manuals and chapters">
    <select id="manual" aria-label="Manual"></select>
    <input id="filter" type="search" placeholder="Find a paragraph number or title…" aria-label="Find a paragraph">
    <div id="tree"></div>
  </nav>
  <main id="main"><div class="empty" id="status">Loading the manuals…</div></main>
</div>
<script src="./lib/rdso_search.js"></script>
<script src="./data/search/search_index.js"></script>
<script src="./data/search/clause_extras.js"></script>
<script src="./data/search/crossrefs.js"></script>
<script src="./data/search/tables.js"></script>
<script src="./lib/rdso_browse.js"></script>
<script src="./ui/settings.js"></script>
<script>
(function () {
  'use strict';
  var PDF = { IRPWM: 'manuals/IRPWM 2024 Corrected Up To ACS - 14 (29-07-2026)-1.pdf', TMM: 'manuals/INDIAN RAILWAYS TRACK MACHINE MANUAL (INCORPORATED UPTO ACS 10)_FINAL.pdf',
              STMM: 'manuals/STMM-date  27.05.24.pdf', USFD: 'manuals/usfd_new 24-2-26.pdf', AT_WELD: 'manuals/ATWeld_Manual-2022.pdf',
              FBW: 'manuals/FBW Manual-Reprint 2022- Incorporated up to CS5.pdf' };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  window.RDSOSettings.mount($('hostSettings'));
  if (!window.RDSOBrowse || !window.RDSO_SEARCH_INDEX) { $('status').textContent = 'The search index did not load.'; return; }
  var model = RDSOBrowse.build(window.RDSO_SEARCH_INDEX), extras = window.RDSO_CLAUSE_EXTRAS || {}, xr = window.RDSO_CROSSREFS || { in: {}, out: {} };
  var tablesByClause = {};
  Object.keys(window.RDSO_TABLES || {}).forEach(function (id) { var t = RDSO_TABLES[id]; (tablesByClause[t.k] = tablesByClause[t.k] || []).push(t); });
  var cur = null;

  $('manual').innerHTML = model.manuals.map(function (m) { return '<option value="' + m.alias + '">' + esc(m.alias.replace('_', ' ') + ' — ' + m.name + ' (' + m.count + ')') + '</option>'; }).join('');

  function label(c) { return c.alias.replace('_', ' ') + ' ' + (model.manuals.filter(function (m) { return m.alias === c.alias; })[0].decimal ? '' : 'para ') + c.para; }
  function drawTree(openId) {
    var m = model.manuals.filter(function (x) { return x.alias === $('manual').value; })[0], f = $('filter').value.toLowerCase().trim();
    $('tree').innerHTML = m.chapters.map(function (ch) {
      var cl = ch.clauses.filter(function (c) { return !f || (c.para + ' ' + c.title).toLowerCase().indexOf(f) >= 0; });
      if (!cl.length) return '';
      var open = f || (openId && cl.some(function (c) { return c.id === openId; })) ? ' open' : '';
      return '<details' + open + '><summary>Ch. ' + ch.num + ' ' + esc(ch.title) + '</summary><ul class="plist">' + cl.map(function (c) {
        return '<li><button data-id="' + esc(c.id) + '"' + (c.id === openId ? ' aria-current="true"' : '') + '>' + esc(c.para) + ' <span class="t">' + esc(c.title.slice(0, 70)) + '</span></button></li>'; }).join('') + '</ul></details>';
    }).join('') || '<div class="empty">Nothing matches.</div>';
  }
  function chip(id) { var c = model.byId[id]; return c ? '<button class="lnk" data-id="' + esc(id) + '">' + esc(label(c)) + (c.title ? ' — ' + esc(c.title.slice(0, 60)) : '') + '</button>' : ''; }
  function tableHtml(t) {
    return '<div class="box"><h3>Table on page ' + t.p + (t.c ? ' — ' + esc(t.c) : '') + '</h3><table class="tb">' + (t.h && t.h.length ? '<tr>' + t.h.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>' : '') +
      t.r.map(function (r) { return '<tr>' + r.map(function (x) { return '<td>' + esc(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
  }
  function show(id, noHash) {
    var c = model.byId[id]; if (!c) return;
    cur = c;
    $('manual').value = c.alias; drawTree(id);
    var par = RDSOBrowse.parentPara(c.alias, c.para), parId = par ? model.manuals.filter(function (m) { return m.alias === c.alias; })[0].chapters.reduce(function (a, ch) { return a || (ch.clauses.filter(function (x) { return x.para === par; })[0] || {}).id; }, null) : null;
    var ex = extras[id] || {}, subs = (ex.s || []).map(function (s) { var sid = s[1]; return model.byId[sid] ? chip(sid) : ''; }).filter(Boolean);
    var outs = [], seen = {};
    (xr.out[id] || []).forEach(function (e) { if (e[2] === 'RESOLVED') e[3].forEach(function (t) { if (model.byId[t] && !seen[t] && t !== id) { seen[t] = 1; outs.push(t); } }); });
    var seenFig = {}, located = [];
    (xr.out[id] || []).forEach(function (e) { if (e[5] && e[5].length && !seenFig[e[0]]) { seenFig[e[0]] = 1; located.push(e); } });
    var ins = (xr.in[id] || []).filter(function (t) { return model.byId[t]; });
    var url = encodeURI(PDF[c.alias] || '') + '#page=' + (c.page || 1);
    $('main').innerHTML = '<article class="read"><div class="crumb">' + esc(c.alias.replace('_', ' ')) + ' › Chapter ' + c.chapterNum + ' ' + esc(c.chapter.replace(/^Chapter\s+\d+\s*[—-]\s*/, '')) + '</div>' +
      '<h2 id="ptitle">' + esc(label(c)) + (c.title && c.title.length <= 70 ? ' — ' + esc(c.title) : '') + '</h2><div class="text" id="ptext">' + esc(c.text) + '</div>' +
      '<div class="acts"><a class="iconbtn" id="askAbout" href="chat.html?q=' + encodeURIComponent('Explain ' + label(c)) + '&manual=' + c.alias + '">Ask about this paragraph</a>' +
      '<a class="iconbtn" id="openPage" target="_blank" rel="noopener" href="' + esc(url) + '">Open page ' + (c.page || '') + ' ↗</a>' +
      '<button class="iconbtn" id="copyLink">Copy link</button>' + (parId ? '<button class="iconbtn" data-id="' + esc(parId) + '">Up to ' + esc(par) + '</button>' : '') + '</div>' +
      (subs.length ? '<div class="box"><h3>Sub-paragraphs</h3><ul>' + subs.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul></div>' : '') +
      (tablesByClause[id] || []).map(tableHtml).join('') +
      (outs.length ? '<div class="box" id="xout"><h3>This paragraph refers to</h3><ul>' + outs.map(function (t) { return '<li>' + chip(t) + '</li>'; }).join('') + '</ul></div>' : '') +
      (located.length ? '<div class="box" id="xloc"><h3>Figures, tables and annexures mentioned (shown only on the page)</h3><ul>' + located.map(function (e) {
        return '<li>' + esc(e[0]) + ' — <a target="_blank" rel="noopener" href="' + esc(encodeURI(PDF[c.alias] || '') + '#page=' + e[5][0]) + '">page ' + e[5][0] + (e[5].length > 1 ? ' (also ' + e[5].slice(1).join(', ') + ')' : '') + ' ↗</a></li>'; }).join('') + '</ul></div>' : '') +
      (ins.length ? '<div class="box" id="xin"><h3>Referred to by</h3><ul>' + ins.slice(0, 30).map(function (t) { return '<li>' + chip(t) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="pn"><button class="iconbtn" id="prev"' + (c.prev ? ' data-id="' + esc(c.prev) + '"' : ' disabled') + '>← Previous</button><button class="iconbtn" id="next"' + (c.next ? ' data-id="' + esc(c.next) + '"' : ' disabled') + '>Next →</button></div></article>';
    $('main').scrollTop = 0;
    document.title = label(c) + ' · Browse the manuals';
    if (!noHash && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    var a = document.querySelector('#tree [aria-current="true"]'); if (a && a.scrollIntoView) a.scrollIntoView({ block: 'nearest' });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]'); if (b && !b.disabled) { show(b.dataset.id); return; }
    if (e.target.id === 'copyLink') { try { navigator.clipboard.writeText(location.href); e.target.textContent = 'Copied'; } catch (x) { e.target.textContent = 'Press Ctrl+C'; } }
  });
  $('manual').addEventListener('change', function () { $('filter').value = ''; drawTree(null); var m = model.manuals.filter(function (x) { return x.alias === $('manual').value; })[0]; if (m.chapters[0]) show(m.chapters[0].clauses[0].id); });
  $('filter').addEventListener('input', function () { drawTree(cur && cur.id); });
  document.addEventListener('keydown', function (e) {
    if (/INPUT|SELECT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
    if (e.key === 'ArrowRight' && cur && cur.next) show(cur.next); else if (e.key === 'ArrowLeft' && cur && cur.prev) show(cur.prev);
  });
  window.addEventListener('hashchange', function () { var id = decodeURIComponent(location.hash.slice(1)); if (model.byId[id] && (!cur || cur.id !== id)) show(id, true); });
  var start = decodeURIComponent(location.hash.slice(1));
  if (model.byId[start]) show(start, true);
  else { drawTree(null); $('main').innerHTML = '<div class="empty">Pick a manual and a paragraph on the left.</div>'; }
  window.__browseReady = true;
})();
</script>
</body>
</html>
