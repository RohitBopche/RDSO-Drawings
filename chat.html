<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5f8">
<title>Track Manuals Atlas · Ask</title>
<link rel="stylesheet" href="./ui/themes.css">
<link rel="stylesheet" href="./ui/shell.css">
<script src="./ui/theme.js"></script>
<style>
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 var(--font);height:100vh;height:100dvh;overflow:hidden}
  button,select,input{font:inherit;color:inherit}
  a{color:var(--accent)}
  .app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;height:100%}
  /* ---- side panel: history and saved answers ---- */
  .side{width:0;overflow:hidden;background:var(--surface);border-right:1px solid var(--line);transition:width .18s}
  .side.open{width:min(300px,86vw)}
  .side .in{width:min(300px,86vw);height:100%;overflow-y:auto;padding:14px}
  .side h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .side button.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--ink);font-size:.92rem}
  .side button.item:hover,.side button.item:focus-visible{background:var(--surface2)}
  .side .sub{display:block;color:var(--muted);font-size:.78rem}
  .side .empty{color:var(--muted);font-size:.85rem;padding:2px 8px}
  /* ---- main column ---- */
  .main{display:flex;flex-direction:column;min-width:0;height:100%}
  .top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
  .top h1{margin:0;font-size:1.05rem;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;cursor:pointer;min-height:34px}
  .iconbtn:hover,.iconbtn:focus-visible{border-color:var(--accent);color:var(--accent)}
  select#scope{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;max-width:190px;min-height:34px}
  #log{flex:1;overflow-y:auto;padding:var(--gap) 14px 20px}
  .col{max-width:860px;margin:0 auto}
  .msg{margin:var(--gap) 0;display:flex}
  .msg.user{justify-content:flex-end}
  .bubble{max-width:100%;border-radius:var(--radius);padding:calc(var(--gap) - 2px) calc(var(--gap) + 4px)}
  .user .bubble{background:var(--user);color:var(--user-ink);max-width:82%}
  .bot .bubble{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%}
  .answer ul{margin:.1rem 0 .3rem 1.1rem;padding:0}.answer li{margin:.35rem 0}
  mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:.88rem}
  .cite{display:inline-flex;gap:4px;align-items:center;background:var(--chip);color:var(--chip-ink);border:1px solid transparent;border-radius:999px;padding:1px 10px;cursor:pointer;text-decoration:none;font-size:.85rem}
  .cite:hover,.cite:focus-visible{border-color:var(--chip-ink)}
  .conf{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.high{background:var(--ok)}.dot.medium{background:var(--warn)}.dot.low{background:var(--bad)}
  .actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .actions button{background:none;border:0;color:var(--muted);border-radius:8px;padding:3px 8px;cursor:pointer;font-size:.85rem}
  .actions button:hover,.actions button:focus-visible{background:var(--surface2);color:var(--ink)}
  .actions button.on{color:var(--accent)}
  .fbnote{color:var(--muted);font-size:.8rem;margin-left:4px}
  details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  summary{cursor:pointer;color:var(--accent);font-size:.9rem}
  .lead,.caveat{font-size:.92rem;color:var(--warn);margin-bottom:4px}
  .muted{color:var(--muted);font-size:.85rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.88rem;cursor:pointer;text-align:left}
  .chip:hover,.chip:focus-visible{border-color:var(--accent);color:var(--accent)}
  .next{margin-top:8px}.next .muted{display:block;margin-bottom:2px}
  pre.full{white-space:pre-wrap;font:.82rem/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);border-radius:8px;padding:8px;max-height:280px;overflow:auto}
  table.tb{border-collapse:collapse;margin:6px 0;font-size:.88rem;display:block;overflow-x:auto;max-width:100%}
  table.tb th,table.tb td{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
  table.tb th{background:var(--surface2)}table.tb td.hit{background:var(--chip);color:var(--chip-ink);font-weight:600}
  .vals{margin:2px 0 0 1.1rem;padding:0;font-size:.9rem}
  /* ---- empty state ---- */
  .hero{text-align:center;padding:5vh 0 10px}
  .hero h2{font-size:1.6rem;margin:0 0 6px}
  .hero p{color:var(--muted);margin:0 auto;max-width:560px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:22px 0 8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
  .card:hover,.card:focus-visible{border-color:var(--accent)}
  .card b{display:block;margin-bottom:2px}.card span{color:var(--muted);font-size:.85rem}
  .note{color:var(--muted);font-size:.82rem;text-align:center;margin-top:16px}
  /* ---- composer ---- */
  form#f{background:var(--surface);border-top:1px solid var(--line);padding:10px 14px}
  .row{max-width:860px;margin:0 auto;display:flex;gap:8px}
  input#q{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem}
  input#q:focus{outline:2px solid var(--accent);outline-offset:1px}
  button.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 20px;cursor:pointer;font-weight:600}
  button:disabled,input:disabled{opacity:.55}
  .foot{max-width:860px;margin:6px auto 0;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .foot button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;font-size:inherit}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.78rem;background:var(--surface2)}
  /* ---- manual page viewer ---- */
  .viewer{width:0;overflow:hidden;background:var(--surface);border-left:1px solid var(--line);transition:width .18s;display:flex;flex-direction:column}
  .viewer.open{width:min(46vw,640px)}
  .viewer header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-width:min(46vw,640px)}
  .viewer header b{flex:1;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .viewer .body{flex:1;display:flex;flex-direction:column;min-width:min(46vw,640px);overflow:auto}
  .viewer img{max-width:100%;border-bottom:1px solid var(--line)}
  ol.rel{padding-left:20px;margin:6px 0}ol.rel li{margin:6px 0}
  .viewer iframe{flex:1;min-height:360px;border:0;background:var(--surface2)}
  /* ---- popovers ---- */
  .pop{position:fixed;z-index:20;right:12px;top:52px;width:min(340px,94vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 34px rgba(0,0,0,.28);padding:14px}
  .pop[hidden]{display:none}
  .pop h3{margin:0 0 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .sw{border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:var(--surface);text-align:center;font-size:.74rem}
  .sw i{display:block;height:20px;border-radius:5px;margin-bottom:4px;border:1px solid rgba(128,128,128,.4)}
  .sw[aria-pressed="true"]{border-color:var(--accent)}
  .seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;cursor:pointer;min-width:60px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh}
  .modal[hidden]{display:none}
  .palette{width:min(560px,94vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 50px rgba(0,0,0,.4);overflow:hidden}
  .palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px;background:var(--surface);font-size:1.02rem}
  .palette input:focus{outline:none}
  .palette ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
  .palette li{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
  .palette li[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
  .palette li small{opacity:.75}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:.85rem;z-index:40}
  .skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--surface);padding:6px 10px;z-index:50}
  @media (max-width:820px){
    .viewer.open{position:fixed;inset:0;width:100%;z-index:15}.viewer header,.viewer .body{min-width:0}
    .side.open{position:fixed;z-index:15;inset:0 auto 0 0;box-shadow:0 0 30px rgba(0,0,0,.4)}
    select#scope{max-width:120px}.hero h2{font-size:1.3rem}
  }
  @media print{.side,.top,form#f,.viewer,.actions,.next,.pop,.modal{display:none!important}body{height:auto;overflow:visible}#log{overflow:visible}.bot .bubble{box-shadow:none}}
</style>
</head>
<body>
<a class="skip" href="#q">Skip to the question box</a>
<div class="app">
  <aside class="side" id="side" aria-label="History and saved answers"><div class="in">
    <h2>Saved answers</h2><div id="savedList"></div>
    <h2>Recent questions</h2><div id="historyList"></div>
    <p class="note" style="text-align:left"><button type="button" class="item" id="clearHistory" style="color:var(--muted)">Clear history</button></p>
  </div></aside>

  <section class="main">
    <header class="top">
      <button class="iconbtn" id="sideBtn" title="History and saved answers" aria-label="History and saved answers" aria-expanded="false">☰</button>
      <h1>Track Manuals Atlas</h1>
      <nav class="tabs" aria-label="Pages"><a href="chat.html" aria-current="page">Ask</a><a href="browse.html">Browse manuals</a><a href="learn.html">Learn</a><a href="index.html">Explore graph</a></nav>
      <label class="muted" for="scope" style="display:none">Search in</label>
      <select id="scope" aria-label="Search in"><option value="">All manuals</option></select>
      <select id="chapter" aria-label="Chapter" hidden><option value="">All chapters</option></select>
      <button class="iconbtn" id="newchat" title="Start a new conversation">New</button>
      <button class="iconbtn" id="paletteBtn" title="Command palette (Ctrl+K)" aria-label="Command palette">⌘K</button>
      <button class="iconbtn" id="settingsBtn" title="Appearance" aria-label="Appearance and reading settings" aria-expanded="false">Aa</button>
    </header>
    <div id="log" aria-live="polite"><div class="col" id="thread"></div></div>
    <form id="f" autocomplete="off">
      <div class="row"><input id="q" type="text" placeholder="Ask a question about the manuals…" aria-label="Your question" disabled>
        <button class="send" id="go" disabled>Ask</button></div>
      <div class="foot"><span id="status">Loading the search index…</span>
        <span><kbd>/</kbd> to type · <kbd>Ctrl</kbd>+<kbd>K</kbd> commands · <button type="button" id="export">Export feedback log</button></span></div>
    </form>
  </section>

  <aside class="viewer" id="viewer" aria-label="Manual page">
    <header><b id="viewerTitle">Manual page</b><a class="iconbtn" id="viewerContext" style="text-decoration:none">Read in context</a><a class="iconbtn" id="viewerOpen" target="_blank" rel="noopener" style="text-decoration:none">Open ↗</a><button class="iconbtn" id="viewerClose" aria-label="Close the page viewer">✕</button></header>
    <div class="body"><img id="viewerImg" alt="" hidden><iframe id="viewerFrame" title="Manual page"></iframe></div>
  </aside>
</div>

<div class="pop" id="settings" hidden role="dialog" aria-label="Appearance">
  <h3>Theme</h3><div class="swatches" id="swatches"></div>
  <h3>Text size</h3><div class="seg" id="sizeSeg"><button data-v="s">Small</button><button data-v="m">Normal</button><button data-v="l">Large</button><button data-v="xl">Extra</button></div>
  <h3>Spacing</h3><div class="seg" id="densitySeg"><button data-v="comfortable">Comfortable</button><button data-v="compact">Compact</button></div>
  <h3>Reading font</h3><div class="seg" id="fontSeg"><button data-v="system">Standard</button><button data-v="readable">Easy to read</button><button data-v="serif">Serif</button><button data-v="mono">Mono</button></div>
  <button class="iconbtn" id="resetUi">Reset appearance</button>
</div>
<div class="modal" id="paletteModal" hidden><div class="palette" role="dialog" aria-label="Command palette">
  <input id="paletteInput" type="text" placeholder="Type a command, a manual, or a paragraph such as “IRPWM 429”…" aria-label="Command">
  <ul id="paletteList" role="listbox"></ul></div></div>

<script src="./lib/rdso_search.js"></script>
<script src="./data/search/search_index.js"></script>
<script src="./data/search/clause_extras.js"></script>
<script src="./data/search/crossrefs.js"></script>
<script src="./data/search/tables.js"></script>
<script src="./data/search/editions.js"></script>
<script src="./data/search/drawing_cites.js"></script>
<script src="./lib/rdso_graphq.js"></script>
<script src="./lib/rdso_chat.js"></script>
<script>
(function () {
  'use strict';
  var PDF = { IRPWM: 'manuals/IRPWM 2024 Corrected Up To ACS - 14 (29-07-2026)-1.pdf', TMM: 'manuals/INDIAN RAILWAYS TRACK MACHINE MANUAL (INCORPORATED UPTO ACS 10)_FINAL.pdf',
              STMM: 'manuals/STMM-date  27.05.24.pdf', USFD: 'manuals/usfd_new 24-2-26.pdf', AT_WELD: 'manuals/ATWeld_Manual-2022.pdf',
              FBW: 'manuals/FBW Manual-Reprint 2022- Incorporated up to CS5.pdf' };
  var TOPICS = [
    { t: 'Track maintenance', d: 'Inspection, tamping, renewals', q: 'How often should the track be inspected by the PWI?' },
    { t: 'Rail welding', d: 'Thermit and flash butt', q: 'What is the procedure for welding a rail joint by thermit?' },
    { t: 'Curves and turnouts', d: 'Versine, cant, points and crossings', q: 'How to measure versine on a curve?' },
    { t: 'Track machines', d: 'Tamping, grinding, cleaning', q: 'What is the speed of utility track vehicle?' },
    { t: 'Ultrasonic testing', d: 'USFD of rails and welds', q: 'How to calibrate an ultrasonic probe?' },
    { t: 'Level crossings', d: 'Gateman duties, whistle boards', q: 'What should the gateman do at a level crossing?' }
  ];
  var STOPW = /^(the|and|for|are|was|what|how|does|with|that|this|from|should|shall|when|which|who|can|you|your|about|tell|give|show|please)$/i;
  var KEY_FB = 'rdso_feedback_v1', KEY_HIST = 'rdso_chat_history_v1', KEY_SAVED = 'rdso_chat_saved_v1';
  var $ = function (id) { return document.getElementById(id); };
  var thread = $('thread'), log = $('log'), input = $('q'), go = $('go'), statusEl = $('status');
  var chat, lastQuestion = '', empty = null;

  function store(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; } catch (e) { return fallback; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  var feedback = {
    read: function () { return store(KEY_FB, []); },
    log: function (e) { var r = this.read(); r.push(Object.assign({ ts: new Date().toISOString(), via: 'chat' }, e)); save(KEY_FB, r.slice(-500)); },
    exportJsonl: function () { return this.read().map(function (r) { return JSON.stringify(r); }).join('\n') + '\n'; }
  };
  window.rdsoFeedback = feedback;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeName(id) { return 'ev_clause_' + String(id).replace(/[^A-Za-z0-9_.-]/g, '_'); }
  function pdfUrl(c) { return encodeURI(PDF[c.alias] || '') + '#page=' + (c.page || 1); }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800); }

  /* highlight the question's own words inside an answer sentence (escape first, then wrap whole words; words are letters/digits only) */
  function hl(text, query) {
    var words = (String(query).toLowerCase().match(/[a-z0-9]{4,}/g) || []).filter(function (w) { return !STOPW.test(w); });
    var out = esc(text);
    if (!words.length) return out;
    var re = new RegExp('\\b((?:' + words.filter(function (w, i, a) { return a.indexOf(w) === i; }).join('|') + ')(?:s|es|ed|ing|ly)?)\\b', 'gi');
    return out.replace(re, '<mark>$1</mark>');
  }
  function citeBtn(c, label) { return '<button type="button" class="cite" data-open="' + esc(JSON.stringify({ alias: c.alias, page: c.page, label: c.label, clause: c.clause })) + '" title="Show this page of the manual">📄 ' + esc(label || (c.label + ' · p.' + c.page)) + '</button>'; }
  function chip(text, ask) { return '<button type="button" class="chip" data-ask="' + esc(ask || text) + '">' + esc(text) + '</button>'; }
  var CONF = { high: ['Strong match', 'high'], medium: ['Likely match', 'medium'], low: ['Not sure', 'low'] };

  function plainAnswer(r, q) {
    var lines = [q, ''].concat((r.table ? r.table.rows.map(function (w) { return r.table.columns.map(function (c, i) { return c + ': ' + w.cells[i]; }).join('; '); }) : r.points.map(function (p) { return '• ' + p.text; })));
    lines.push('', 'Source: ' + r.primary.label + ', page ' + r.primary.page + ' (' + ((window.RDSOChat.MANUALS[r.primary.alias]) || r.primary.alias) + ')');
    return lines.join('\n');
  }

  function render(r, q) {
    var h = '';
    if (r.kind === 'answer') {
      var cf = CONF[r.confidence] || CONF.medium;
      h += '<div class="answer">';
      if (r.lead) h += '<div class="lead">' + esc(r.lead) + '</div>';
      if (r.interpreted) h += '<div class="muted">Understood as: ' + esc(r.interpreted) + '</div>';
      if (r.table) {
        var T = r.table;
        h += '<table class="tb"><thead><tr>' + T.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
             T.rows.map(function (row) { return '<tr>' + row.cells.map(function (c, i) { return '<td' + (row.hit[i] ? ' class="hit"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
        if (T.truncatedColumns) h += '<div class="muted">Only the matching columns are shown.</div>';
      } else {
        h += '<ul>' + r.points.map(function (p) { return '<li>' + hl(p.text, q) + '</li>'; }).join('') + '</ul>';
      }
      (r.ownedTables || []).forEach(function (O) {
        h += '<div class="muted" style="margin-top:6px">Table in this paragraph (page ' + esc(O.page) + ')</div><table class="tb"><thead><tr>' + O.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
             O.rows.map(function (row) { return '<tr>' + row.cells.map(function (c, i) { return '<td' + (row.hit[i] ? ' class="hit"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      });
      if (r.edition) h += '<div class="muted" id="edition" style="margin-top:6px">From: ' + esc(r.edition) + (r.amendments && r.amendments.length ? ' · this paragraph carries correction-slip marks ' + esc(r.amendments.join(', ')) + ' (amended text)' : '') + '</div>';
      h += '<div class="meta">' + citeBtn(r.primary) + '<span class="conf"><span class="dot ' + cf[1] + '"></span>' + cf[0] + '</span></div>';
      h += '<div class="actions"><button type="button" data-act="copy">Copy</button><button type="button" data-act="save">☆ Save</button>' +
           '<button type="button" data-fb="up" title="Helpful">👍</button><button type="button" data-fb="down" title="Not helpful">👎</button><span class="fbnote"></span></div>';
      var more = '';
      if (r.values && r.values.length) more += '<div class="muted">Values in those sentences (machine-extracted)</div><ul class="vals">' + r.values.map(function (v) { return '<li>' + (v.quantity ? '<b>' + esc(v.quantity) + '</b>: ' : '') + esc(v.text) + '</li>'; }).join('') + '</ul>';
      if (r.alsoSee && r.alsoSee.length) more += '<div class="muted" style="margin-top:6px">Also relevant</div><ul>' + r.alsoSee.map(function (p) { return '<li>' + hl(p.text, q) + ' ' + citeBtn(p.cite) + '</li>'; }).join('') + '</ul>';
      if (r.subparas && r.subparas.length) more += '<div class="muted" style="margin-top:6px">This paragraph continues in its sub-paragraphs</div><div class="chips">' + r.subparas.map(function (s) { return chip(s.para, 'What does ' + r.primary.alias + ' Para ' + s.para + ' say?'); }).join('') + '</div>';
      if (r.drawings && r.drawings.length) more += '<div class="muted" style="margin-top:6px">Drawings cited here that are in this collection: ' + r.drawings.map(function (d) { return '<a href="' + esc(encodeURI(d.file)) + '" target="_blank" rel="noopener">T-' + esc(d.number) + '</a>'; }).join(' ') + '</div>';
      if (r.caveat) more += '<div class="caveat" style="margin-top:6px">' + esc(r.caveat) + '</div>';
      if (r.table) more += '<div class="muted" style="margin-top:6px">Whole table (' + r.table.totalRows + ' rows' + (r.table.totalRows > 60 ? ', first 60' : '') + ')</div><table class="tb"><thead><tr>' + r.table.full.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        r.table.full.rows.map(function (row) { return '<tr>' + row.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      more += '<div class="muted" style="margin-top:6px">Full paragraph, ' + esc(r.primary.label) + '</div><pre class="full">' + esc(r.primary.text.slice(0, 3000)) + (r.primary.text.length > 3000 ? '\n…' : '') + '</pre>';
      h += '<details><summary>Details</summary>' + more + '</details>';
      if (r.followups && r.followups.length) h += '<div class="next"><span class="muted">Ask next</span><div class="chips">' + r.followups.map(function (f) { return chip(f); }).join('') + '</div></div>';
      h += '</div>';
    } else if (r.kind === 'clarify') {
      h += esc(r.text) + '<div class="chips">' + r.options.map(function (o) { return chip(o.name + ' — ' + o.label + ': ' + o.title.slice(0, 50), o.ask); }).join('') + '</div>';
    } else if (r.kind === 'no_evidence') {
      h += '<div>' + esc(r.text) + '</div>';
      if (r.nearest && r.nearest.length) h += '<div class="muted" style="margin-top:6px">Closest topics in the manuals</div><div class="chips">' + r.nearest.map(function (n) { return chip(n.label + ' — ' + n.title.slice(0, 50), 'What does ' + n.alias + ' Para ' + n.para + ' say?'); }).join('') + '</div>';
      h += '<div class="actions"><button type="button" data-fb="down" title="Report this question">👎 Report</button><span class="fbnote"></span></div>';
    } else if (r.kind === 'relation') {
      h += '<div class="answer"><div class="lead">' + esc(r.text) + '</div>';
      if (r.rows && r.rows.length) {
        h += '<ol class="rel">' + r.rows.map(function (x) {
          if (r.mode === 'path') return '<li>' + citeBtn(x.from, x.from.label) + ' → ' + citeBtn(x.to, x.to.label) + '<div class="muted">' + (x.back ? 'Printed as a “Back to” note in ' + esc(x.at.label) + ': ' : 'In ' + esc(x.at.label) + ': ') + '“' + esc(x.quote) + '”</div></li>';
          if (r.mode === 'mentions') return '<li><b>' + esc(x.raw) + '</b> <span class="muted">(' + esc(x.kindName) + (x.status === 'RESOLVED' ? ', page ' + esc(x.page || '?') : x.page ? ', shown as a picture on page ' + esc(x.page) : ', not located') + ')</span>' + (x.quote ? '<div class="muted">“' + esc(x.quote) + '”</div>' : '') + '</li>';
          if (r.mode === 'drawing') return '<li>' + citeBtn(x.cite, x.cite.label + ' · p.' + x.cite.page) + ' <b>' + esc(x.raw) + '</b><div class="muted">“' + esc(x.quote) + '”</div></li>';
          return '<li>' + (x.depth > 1 ? '<span class="muted">via ' + esc(x.via.label) + ' → </span>' : '') + citeBtn(x.cite, x.cite.label + ' · p.' + x.cite.page) + '<div class="muted">' + (x.back ? 'Printed as a “Back to” note in ' + esc(x.at.label) + ': ' : 'In ' + esc(x.at.label) + ': ') + '“' + esc(x.quote) + '”</div></li>';
        }).join('') + '</ol>';
        if (r.total > r.shown) h += '<div class="muted">Showing ' + r.shown + ' of ' + r.total + '.</div>';
      }
      h += '<div class="muted" style="margin-top:6px">Links are the manuals’ own cross-references; nothing is inferred.</div></div>';
    } else if (r.kind === 'more') {
      h += '<pre class="full" style="max-height:none">' + esc(r.text.slice(0, 6000)) + '</pre><div class="meta">' + citeBtn(r.primary) + '</div>';
    } else if (r.kind === 'source') {
      h += esc(r.text) + '<div class="meta">' + citeBtn(r.primary) + '</div>';
    } else if (r.kind === 'related_list') {
      h += esc(r.text) + '<div class="chips">' + r.related.map(function (n) { return chip(n.label + ' — ' + n.title.slice(0, 50), 'What does ' + n.alias + ' Para ' + n.para + ' say?'); }).join('') + '</div>';
    } else {
      h += esc(r.text || '');
      if (r.examples) h += '<div class="chips">' + r.examples.map(function (e) { return chip(e); }).join('') + '</div>';
    }
    return h;
  }

  function add(role, html) {
    var d = document.createElement('div'); d.className = 'msg ' + role;
    d.innerHTML = '<div class="bubble">' + html + '</div>';
    thread.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }

  /* ---- history and saved answers ---- */
  function remember(q, r) {
    var h = store(KEY_HIST, []).filter(function (x) { return x.q !== q; });
    h.unshift({ q: q, t: Date.now(), clause: r.primary ? r.primary.label : '' }); save(KEY_HIST, h.slice(0, 40)); drawSide();
  }
  function drawSide() {
    var saved = store(KEY_SAVED, []), hist = store(KEY_HIST, []);
    $('savedList').innerHTML = saved.length ? saved.map(function (s, i) { return '<button class="item" data-saved="' + i + '">' + esc(s.q) + '<span class="sub">' + esc(s.label) + ' · p.' + esc(s.page) + '</span></button>'; }).join('') : '<div class="empty">Nothing saved yet. Use ☆ Save under an answer.</div>';
    $('historyList').innerHTML = hist.length ? hist.map(function (x) { return '<button class="item" data-hist="' + esc(x.q) + '">' + esc(x.q) + (x.clause ? '<span class="sub">' + esc(x.clause) + '</span>' : '') + '</button>'; }).join('') : '<div class="empty">Your questions appear here (kept on this computer only).</div>';
  }

  /* ---- ask ---- */
  function showEmpty() {
    thread.innerHTML = '';
    empty = document.createElement('div');
    empty.innerHTML = '<div class="hero"><h2>Ask the manuals</h2><p>Answers come only from six railway manuals, with the paragraph and page for every statement. Nothing leaves this computer.</p></div>' +
      '<div class="cards">' + TOPICS.map(function (t) { return '<button class="card" data-ask="' + esc(t.q) + '"><b>' + esc(t.t) + '</b><span>' + esc(t.d) + '</span></button>'; }).join('') + '</div>' +
      '<p class="note">It does not calculate, and says so when the manuals do not answer. Press <kbd>Ctrl</kbd>+<kbd>K</kbd> for commands, or try “IRPWM 429”.</p>';
    thread.appendChild(empty);
  }
  function ask(text) {
    text = String(text || '').trim();
    if (!text || !chat) return;
    if (empty) { empty.remove(); empty = null; }
    lastQuestion = text;
    add('user', esc(text));
    var r = chat.ask(text);
    var node = add('bot', render(r, text));
    node.dataset.query = text; node.dataset.clause = r.primary ? r.primary.clause : '';
    node._reply = r;
    feedback.log({ type: 'query', query: text, status: r.kind === 'answer' ? 'answer' : r.kind, scope: chat.getScope(), coverage: r.coverage == null ? null : +r.coverage.toFixed(3),
                   clause: r.primary ? r.primary.clause : null, shown: r.primary ? [r.primary.clause].concat((r.related || []).map(function (x) { return x.clause; })) : [] });
    if (r.kind === 'answer' || r.kind === 'no_evidence') remember(text, r);
    log.scrollTop = log.scrollHeight;
  }

  /* ---- viewer ---- */
  function openViewer(c) {
    var v = $('viewer'); v.classList.add('open');
    $('viewerTitle').textContent = c.label + ' · page ' + c.page;
    $('viewerContext').href = c.clause ? 'browse.html#' + encodeURIComponent(c.clause) : 'browse.html';
    var url = pdfUrl(c); $('viewerFrame').src = url; $('viewerOpen').href = url;
    var img = $('viewerImg'); img.hidden = true; img.onload = function () { img.hidden = false; }; img.onerror = function () { img.hidden = true; };
    img.src = 'artifacts/evidence/' + safeName(c.clause) + '.png';
  }
  function closeViewer() { $('viewer').classList.remove('open'); $('viewerFrame').src = 'about:blank'; }

  /* ---- settings ---- */
  function drawSettings() {
    var p = window.RDSOTheme.read();
    $('swatches').innerHTML = window.RDSOTheme.THEMES.map(function (t) {
      return '<button class="sw" data-theme="' + t.id + '" aria-pressed="' + (p.theme === t.id) + '"><i style="background:linear-gradient(90deg,' + t.swatch[0] + ' 0 50%,' + t.swatch[2] + ' 50% 100%)"></i>' + esc(t.name) + '</button>';
    }).join('');
    [['sizeSeg', 'size'], ['densitySeg', 'density'], ['fontSeg', 'font']].forEach(function (x) {
      $(x[0]).querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(p[x[1]] === b.dataset.v)); });
    });
  }
  function togglePop(id, btn, force) {
    var el = $(id), show = force == null ? el.hidden : force;
    el.hidden = !show; if (btn) $(btn).setAttribute('aria-expanded', String(show)); if (show && id === 'settings') drawSettings();
  }

  /* ---- command palette ---- */
  var cmds = [];
  function buildCommands(filter) {
    var f = String(filter || '').trim(), list = [];
    var m = /^([A-Za-z_]+)\s*(?:para(?:graph)?\s*)?(\d+(?:\.\d+)*)$/i.exec(f);
    if (m && window.RDSOChat.MANUALS[m[1].toUpperCase()]) list.push({ n: 'Show ' + m[1].toUpperCase() + ' Para ' + m[2], k: 'paragraph', run: function () { ask('What does Para ' + m[2] + ' of ' + m[1].toUpperCase() + ' say?'); } });
    list.push({ n: 'New conversation', k: 'chat', run: newChat });
    list.push({ n: 'Search in all manuals', k: 'scope', run: function () { setScope(''); } });
    Object.keys(window.RDSOChat.MANUALS).forEach(function (a) { list.push({ n: 'Search only in ' + a + ' — ' + window.RDSOChat.MANUALS[a], k: 'scope', run: function () { setScope(a); } }); });
    window.RDSOTheme.THEMES.forEach(function (t) { list.push({ n: 'Theme: ' + t.name, k: 'appearance', run: function () { window.RDSOTheme.set('theme', t.id); } }); });
    list.push({ n: 'Larger text', k: 'appearance', run: function () { var o = ['s', 'm', 'l', 'xl'], c = o.indexOf(window.RDSOTheme.read().size); window.RDSOTheme.set('size', o[Math.min(3, c + 1)]); } });
    list.push({ n: 'Smaller text', k: 'appearance', run: function () { var o = ['s', 'm', 'l', 'xl'], c = o.indexOf(window.RDSOTheme.read().size); window.RDSOTheme.set('size', o[Math.max(0, c - 1)]); } });
    list.push({ n: 'Print this conversation', k: 'chat', run: function () { window.print(); } });
    list.push({ n: 'Show saved answers and history', k: 'panel', run: function () { toggleSide(true); } });
    var q = f.toLowerCase();
    return list.filter(function (c) { return !q || c.n.toLowerCase().indexOf(q) >= 0 || c.k.indexOf(q) >= 0; }).slice(0, 9);
  }
  var sel = 0;
  function drawPalette() {
    cmds = buildCommands($('paletteInput').value); sel = Math.min(sel, Math.max(0, cmds.length - 1));
    $('paletteList').innerHTML = cmds.map(function (c, i) { return '<li role="option" data-i="' + i + '" aria-selected="' + (i === sel) + '">' + esc(c.n) + '<small>' + esc(c.k) + '</small></li>'; }).join('') || '<li>No match. Press Enter to ask this as a question.</li>';
  }
  function openPalette() { $('paletteModal').hidden = false; $('paletteInput').value = ''; sel = 0; drawPalette(); $('paletteInput').focus(); }
  function closePalette() { $('paletteModal').hidden = true; input.focus(); }
  function runCommand(i) { var c = cmds[i]; var typed = $('paletteInput').value; closePalette(); if (c) c.run(); else if (typed.trim()) ask(typed); }

  function fillChapters(a) {
    var sel = $('chapter'), seen = {}, rows = [];
    window.RDSO_SEARCH_INDEX.docs.forEach(function (d) {
      var m = /^CLAUSE:([^:]+):CH_(\d+):/.exec(d.clause || ''); if (!m || m[1] !== a || d.kind || seen[m[2]]) return; seen[m[2]] = 1;
      rows.push([parseInt(m[2], 10), String(d.chapter || '').replace(/^Chapter\s+\d+\s*[—-]\s*/, '')]);
    });
    rows.sort(function (x, y) { return x[0] - y[0]; });
    sel.innerHTML = '<option value="">All chapters</option>' + rows.map(function (r) { return '<option value="' + r[0] + '">Ch. ' + r[0] + ' ' + esc(r[1].slice(0, 40)) + '</option>'; }).join('');
    sel.hidden = !a || !rows.length;
  }
  function setScope(a, chapter) {
    $('scope').value = a; fillChapters(a); $('chapter').value = chapter || '';
    chat.setScope(a, chapter);
    toast(a ? 'Searching only in ' + a + (chapter ? ', chapter ' + chapter : '') : 'Searching all manuals');
  }
  function newChat() { chat.reset(); showEmpty(); input.focus(); }
  function toggleSide(force) { var s = $('side'), open = force == null ? !s.classList.contains('open') : force; s.classList.toggle('open', open); $('sideBtn').setAttribute('aria-expanded', String(open)); }

  /* ---- events ---- */
  $('f').addEventListener('submit', function (e) { e.preventDefault(); var t = input.value; input.value = ''; ask(t); });
  document.addEventListener('click', function (e) {
    var t = e.target;
    var a = t.closest('[data-ask]'); if (a) { ask(a.dataset.ask); return; }
    var o = t.closest('[data-open]'); if (o) { openViewer(JSON.parse(o.dataset.open)); return; }
    var hs = t.closest('[data-hist]'); if (hs) { ask(hs.dataset.hist); if (window.innerWidth < 820) toggleSide(false); return; }
    var sv = t.closest('[data-saved]'); if (sv) { var s = store(KEY_SAVED, [])[+sv.dataset.saved]; if (s) { ask(s.q); if (window.innerWidth < 820) toggleSide(false); } return; }
    var th = t.closest('.sw'); if (th) { window.RDSOTheme.set('theme', th.dataset.theme); drawSettings(); return; }
    var seg = t.closest('.seg button'); if (seg) { window.RDSOTheme.set(seg.parentNode.id.replace('Seg', ''), seg.dataset.v); drawSettings(); return; }
    var fb = t.closest('[data-fb]');
    if (fb) {
      var m = fb.closest('.msg');
      feedback.log({ type: 'feedback', query: m.dataset.query, clause: m.dataset.clause || null, verdict: fb.dataset.fb });
      var note = m.querySelector('.fbnote'); if (note) note.textContent = fb.dataset.fb === 'up' ? 'Thanks, saved on this computer.' : 'Saved for review.';
      return;
    }
    var act = t.closest('[data-act]');
    if (act) {
      var msg = act.closest('.msg'), r = msg._reply;
      if (act.dataset.act === 'copy') {
        var text = plainAnswer(r, msg.dataset.query);
        (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Copied with its source'); }, function () {
          var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied with its source'); } catch (x) { toast('Copy is not available here'); } ta.remove(); });
      } else if (act.dataset.act === 'save') {
        var list = store(KEY_SAVED, []); list = list.filter(function (x) { return x.q !== msg.dataset.query; });
        list.unshift({ q: msg.dataset.query, label: r.primary.label, page: r.primary.page }); save(KEY_SAVED, list.slice(0, 50));
        act.classList.add('on'); act.textContent = '★ Saved'; drawSide(); toast('Saved to the side panel');
      }
      return;
    }
    if (!t.closest('#settings') && !t.closest('#settingsBtn')) togglePop('settings', 'settingsBtn', false);
  });
  $('sideBtn').addEventListener('click', function () { toggleSide(); });
  $('settingsBtn').addEventListener('click', function (e) { e.stopPropagation(); togglePop('settings', 'settingsBtn'); });
  $('paletteBtn').addEventListener('click', openPalette);
  $('newchat').addEventListener('click', newChat);
  $('viewerClose').addEventListener('click', closeViewer);
  $('resetUi').addEventListener('click', function () { window.RDSOTheme.reset(); drawSettings(); });
  $('scope').addEventListener('change', function () { setScope(this.value); });
  $('chapter').addEventListener('change', function () { setScope($('scope').value, this.value); });
  $('clearHistory').addEventListener('click', function () { save(KEY_HIST, []); drawSide(); });
  $('export').addEventListener('click', function () {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([feedback.exportJsonl()], { type: 'application/x-ndjson' })); a.download = 'rdso_feedback.jsonl'; a.click();
  });
  $('paletteInput').addEventListener('input', function () { sel = 0; drawPalette(); });
  $('paletteInput').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { sel = Math.min(cmds.length - 1, sel + 1); drawPalette(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); drawPalette(); e.preventDefault(); }
    else if (e.key === 'Enter') { runCommand(sel); e.preventDefault(); }
  });
  $('paletteList').addEventListener('click', function (e) { var li = e.target.closest('li[data-i]'); if (li) runCommand(+li.dataset.i); });
  $('paletteModal').addEventListener('click', function (e) { if (e.target === this) closePalette(); });
  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('paletteModal').hidden ? openPalette() : closePalette(); }
    else if (e.key === 'Escape') { if (!$('paletteModal').hidden) closePalette(); else if ($('viewer').classList.contains('open')) closeViewer(); else if (!$('settings').hidden) togglePop('settings', 'settingsBtn', false); else if ($('side').classList.contains('open')) toggleSide(false); }
    else if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); }
    else if (e.key === 'ArrowUp' && document.activeElement === input && !input.value && lastQuestion) { input.value = lastQuestion; e.preventDefault(); }
  });

  function start() {
    if (!window.RDSOSearch || !window.RDSO_SEARCH_INDEX || !window.RDSOChat) { statusEl.textContent = 'The search index did not load.'; return; }
    var eng = window.RDSOSearch.create(window.RDSO_SEARCH_INDEX);
    chat = window.RDSOChat.create(eng, { extras: window.RDSO_CLAUSE_EXTRAS, xrefs: window.RDSO_CROSSREFS, tables: window.RDSO_TABLES, editions: window.RDSO_EDITIONS, graph: window.RDSOGraphQ.create({ xrefs: window.RDSO_CROSSREFS, clauseText: function (id) { return eng.clauseText(id); }, drawingCites: window.RDSO_DRAWING_CITES }) });
    window.rdsoChat = chat;
    Object.keys(window.RDSOChat.MANUALS).forEach(function (a) { var o = document.createElement('option'); o.value = a; o.textContent = a + ' — ' + window.RDSOChat.MANUALS[a]; $('scope').appendChild(o); });
    statusEl.textContent = 'Ready. Nothing leaves this computer.';
    input.disabled = go.disabled = false; input.focus();
    drawSide(); showEmpty();
    var qs = new URLSearchParams(location.search), qm = qs.get('manual'), qq = qs.get('q');
    if (qm && window.RDSOChat.MANUALS[qm]) setScope(qm, qs.get('chapter'));
    if (qq) ask(qq);
  }
  start();
})();
</script>
</body>
</html>
